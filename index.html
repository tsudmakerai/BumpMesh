<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BumpMesh</title><style>html,body{height:100%;margin:0;background:#f4f3f1;font:14px system-ui;color:#555;display:grid;place-items:center}</style></head><body>Загрузка BumpMesh…<script>(async()=>{try{const get=async(p,n)=>{const a=[];for(let i=1;i<=n;i++)a.push(fetch(`${p}${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}));return(await Promise.all(a)).join('')};const unzip=async s=>{const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};let html=await unzip(await get('p',6));const patches=JSON.parse(await unzip(await get('r',2)));for(const p of patches){if(!html.includes(p[0]))throw Error('patch mismatch');html=html.replace(p[0],p[1])}document.open();document.write(html);document.close()}catch(e){document.body.textContent='Ошибка загрузки: '+e.message}})()</script></body></html>
