<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BumpMesh</title><style>html,body{height:100%;margin:0;background:#f4f3f1;font:14px system-ui;color:#555;display:grid;place-items:center;text-align:center;padding:16px;box-sizing:border-box}</style></head><body><div id="status">Загрузка BumpMesh…</div><script>(async()=>{const status=document.getElementById('status'),base='https://tsudmakerai.github.io/BumpMesh/',ver='20260803-1303';const sleep=ms=>new Promise(r=>setTimeout(r,ms));const one=async name=>{let last;for(let n=1;n<=4;n++){try{status.textContent=`Загрузка BumpMesh… ${name} (${n}/4)`;const r=await fetch(base+name+'?v='+ver,{cache:'no-store',credentials:'omit'});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}catch(e){last=e;if(n<4)await sleep(500*n)}}throw Error(name+': '+(last?.message||'сеть недоступна'))};const get=async(p,n)=>{let s='';for(let i=1;i<=n;i++)s+=await one(p+String(i).padStart(2,'0')+'.txt');return s};const unzip=async s=>{if(!('DecompressionStream'in window))throw Error('Обновите Android System WebView или Chrome');const b=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};try{let html=await unzip(await get('p',6));const patches=JSON.parse(await unzip(await get('r',2)));for(const p of patches){if(!html.includes(p[0]))throw Error('несовместимый кэш');html=html.replace(p[0],p[1])}document.open();document.write(html);document.close()}catch(e){status.innerHTML='Ошибка загрузки: '+e.message+'<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#222;color:#fff">Повторить</button>'}})()</script></body></html>
