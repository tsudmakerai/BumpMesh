<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BumpMesh</title><style>html,body{height:100%;margin:0;background:#f4f3f1;font:14px system-ui;color:#555;display:grid;place-items:center}</style></head><body>Загрузка BumpMesh…<script>(async()=>{try{const n=6,a=[];for(let i=1;i<=n;i++)a.push(fetch(`p${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}));const s=(await Promise.all(a)).join(''),b=Uint8Array.from(atob(s),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');let html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();const patches=[["  adj:null, adjRef:null, dispMap:null, dispMapLen:-1, mapBaseRef:null,\n  rotX:0.45, rotY:0.7, dist:110, pan:[0,0],\n  busy:false, pendingApply:false, fileName:\"model\",\n","  adj:null, adjRef:null, dispMap:null, dispMapLen:-1, mapBaseRef:null,\n  rotX:0.45, rotY:0.7, dist:110, pan:[0,0,0],\n  busy:false, pendingApply:false, fileName:\"model\",\n"],["  const cz=state.dist*Math.cos(state.rotX)*Math.cos(state.rotY);\n  const eye=[cx+state.pan[0],cy,cz+state.pan[1]];\n  const view=lookAt(eye,[state.pan[0],0,state.pan[1]],[0,1,0]);\n  const vp=mul4(proj,view);\n","  const cz=state.dist*Math.cos(state.rotX)*Math.cos(state.rotY);\n  const eye=[cx+state.pan[0],cy+state.pan[1],cz+state.pan[2]];\n  const view=lookAt(eye,[state.pan[0],state.pan[1],state.pan[2]],[0,1,0]);\n  const vp=mul4(proj,view);\n"],["let pinch=null;\nlet painting=false;\nconst paintArmed=e=>state.maskMode===\"paint\"&&e.button===0&&!e.shiftKey&&pointers.size===0;\n","let pinch=null;\nlet painting=false,paintDirty=false;\n/* Сдвиг в экранных координатах камеры: объект следует за курсором без инверсии. */\nfunction panCamera(dx,dy){\n  const rx=state.rotX,ry=state.rotY;\n  const sr=Math.sin(rx),cr=Math.cos(rx),sy=Math.sin(ry),cy=Math.cos(ry);\n  const right=[cy,0,-sy];\n  const up=[-sr*sy,cr,-sr*cy];\n  const k=state.dist/600;\n  state.pan[0]+=(-right[0]*dx+up[0]*dy)*k;\n  state.pan[1]+=up[1]*dy*k;\n  state.pan[2]+=(-right[2]*dx+up[2]*dy)*k;\n}\nconst paintArmed=e=>state.maskMode===\"paint\"&&e.button===0&&!e.shiftKey&&pointers.size===0;\n"],["    canvas.setPointerCapture(e.pointerId);\n    painting=true;\n    if(state.tool===\"wand\")wandAt(e,e.altKey); else paintAt(e,e.altKey);\n    return;\n","    canvas.setPointerCapture(e.pointerId);\n    paintDirty=false;\n    if(state.tool===\"wand\"){\n      /* авто-граница сама запускает пересчёт только при успешном выборе */\n      painting=false;\n      wandAt(e,e.altKey);\n    }else{\n      painting=true;\n      paintDirty=paintAt(e,e.altKey)||paintDirty;\n    }\n    return;\n"],["canvas.addEventListener(\"pointermove\",e=>{\n  if(painting){ if(state.tool===\"brush\")paintAt(e,e.altKey); return; }\n  if(!pointers.has(e.pointerId))return;\n","canvas.addEventListener(\"pointermove\",e=>{\n  if(painting){\n    if(state.tool===\"brush\")paintDirty=paintAt(e,e.altKey)||paintDirty;\n    return;\n  }\n  if(!pointers.has(e.pointerId))return;\n"],["    if(d>1&&pinch.d>1)state.dist=clamp(state.dist*pinch.d/d,30,600);\n    state.pan[0]-=(mx-pinch.mx)*state.dist/600;\n    state.pan[1]+=(my-pinch.my)*state.dist/600;\n    pinch={d,mx,my};\n","    if(d>1&&pinch.d>1)state.dist=clamp(state.dist*pinch.d/d,30,600);\n    panCamera(mx-pinch.mx,my-pinch.my);\n    pinch={d,mx,my};\n"],["  }else if(pointers.size===1){\n    if(pt.btn===2){state.pan[0]-=dx*state.dist/600;state.pan[1]+=dy*state.dist/600;}\n    else{state.rotY+=dx*0.008;state.rotX=clamp(state.rotX+dy*0.008,-1.45,1.45);}\n","  }else if(pointers.size===1){\n    if(pt.btn===2){panCamera(dx,dy);}\n    else{state.rotY+=dx*0.008;state.rotX=clamp(state.rotX+dy*0.008,-1.45,1.45);}\n"],["const endPointer=e=>{\n  if(painting){painting=false;scheduleApply();}\n  pointers.delete(e.pointerId);\n","const endPointer=e=>{\n  if(painting){\n    painting=false;\n    /* полный рендер нужен только если кисть действительно изменила маску */\n    if(paintDirty)scheduleApply();\n    paintDirty=false;\n  }\n  pointers.delete(e.pointerId);\n"],["  const pb=ensurePaint();\n  if(!pb||!lastVP)return;\n  const r=canvas.getBoundingClientRect();\n","  const pb=ensurePaint();\n  if(!pb||!lastVP)return false;\n  const r=canvas.getBoundingClientRect();\n"],["  const px=e.clientX-r.left, py=e.clientY-r.top, W=r.width, H=r.height;\n  const G=paintGeom(); if(!G)return;\n  const p=G.p, nr=G.n, n=p.length/3;\n","  const px=e.clientX-r.left, py=e.clientY-r.top, W=r.width, H=r.height;\n  const G=paintGeom(); if(!G)return false;\n  const p=G.p, nr=G.n, n=p.length/3;\n"],["  if(touched){refreshMaskPreview();updateTags();}\n}\n","  if(touched){refreshMaskPreview();updateTags();}\n  return touched;\n}\n"],["document.getElementById(\"resetView\").addEventListener(\"click\",()=>{\n  state.rotX=0.45;state.rotY=0.7;state.dist=110;state.pan=[0,0];render();\n});\n","document.getElementById(\"resetView\").addEventListener(\"click\",()=>{\n  state.rotX=0.45;state.rotY=0.7;state.dist=110;state.pan=[0,0,0];render();\n});\n"]];for(const p of patches){if(!html.includes(p[0]))throw Error('patch mismatch');html=html.replace(p[0],p[1])}document.open();document.write(html);document.close()}catch(e){document.body.textContent='Ошибка загрузки: '+e.message}})()</script></body></html>
