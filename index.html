<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BumpMesh</title><style>html,body{height:100%;margin:0;background:#f4f3f1;font:14px system-ui;color:#555;display:grid;place-items:center;text-align:center}button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#222;color:#fff}iframe{display:none}</style></head><body><div id="s">Запуск BumpMesh…</div><script>const V='20260803-1400',s=document.getElementById('s');const wait=n=>new Promise(r=>setTimeout(r,n));const one=name=>new Promise((ok,bad)=>{const f=document.createElement('iframe');f.onload=()=>{try{const d=f.contentDocument,t=(d&&d.body?d.body.innerText:'')||'';f.remove();t?ok(t):bad(Error('пусто'))}catch(e){f.remove();bad(e)}};f.onerror=()=>{f.remove();bad(Error('сеть'))};f.src=name+'?v='+V;document.body.appendChild(f)});const load=async name=>{let e;for(let i=1;i<=4;i++){try{s.textContent='Загрузка '+name+' · попытка '+i;return await one(name)}catch(x){e=x;if(i<4)await wait(i*400)}}throw Error(name)};const get=async(p,n)=>{let a='';for(let i=1;i<=n;i++)a+=await load(p+String(i).padStart(2,'0')+'.txt');return a};const unzip=async x=>{if(!window.DecompressionStream)throw Error('обновите Android System WebView');const b=Uint8Array.from(atob(x.replace(/\s+/g,'')),c=>c.charCodeAt(0));return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};(async()=>{try{let h=await unzip(await get('p',6)),q=JSON.parse(await unzip(await get('r',2)));for(const p of q){if(!h.includes(p[0]))throw Error('несовместимые файлы');h=h.replace(p[0],p[1])}document.open();document.write(h);document.close()}catch(e){s.innerHTML='Ошибка запуска: '+e.message+'<br><button onclick="location.reload()">Повторить</button>'}})()</script></body></html>
