<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BumpMesh</title><style>html,body{height:100%;margin:0;background:#f4f3f1;font:14px system-ui;color:#555;display:grid;place-items:center;text-align:center}button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#222;color:#fff}iframe{display:none}small{color:#999}</style></head><body><div id="s">Запуск BumpMesh · v1900<br><small id="d"></small></div><script>const V='20260803-1900',s=document.getElementById('s'),d=document.getElementById('d');const wait=n=>new Promise(r=>setTimeout(r,n));const one=name=>new Promise((ok,bad)=>{const f=document.createElement('iframe');f.onload=()=>{try{const doc=f.contentDocument,t=(doc&&doc.body?doc.body.innerText:'')||'';f.remove();t?ok(t):bad(Error('пусто'))}catch(e){f.remove();bad(e)}};f.onerror=()=>{f.remove();bad(Error('сеть'))};f.src=name+'?v='+V;document.body.appendChild(f)});const get=async(p,n)=>{let a='',c=0;for(let i=1;i<=n;i++){const nm=p+String(i).padStart(2,'0')+'.txt';let e;for(let k=1;k<=4;k++){try{d.textContent='Части: '+c+'/8 · '+nm+' · попытка '+k;a+=await one(nm);c++;e=null;break}catch(x){e=x;if(k<4)await wait(k*400)}}if(e)throw Error(nm)}return a};const unzip=async x=>{if(!window.DecompressionStream)throw Error('обновите Android System WebView');const b=Uint8Array.from(atob(x.replace(/\s+/g,'')),c=>c.charCodeAt(0));return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};(async()=>{try{let h=await unzip(await get('p',6)),q=JSON.parse(await unzip(await get('r',2)));for(const p of q){if(!h.includes(p[0]))throw Error('несовместимые файлы');h=h.replace(p[0],p[1])}document.open();document.write(h);document.close()}catch(e){s.innerHTML='Ошибка запуска: '+e.message+'<br><button onclick="location.reload()">Повторить</button>'}})()</script></body></html>
